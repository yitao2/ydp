[package]
name = "ydp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
description = "A strongly typed, async-only Chrome DevTools Protocol client for Rust"
readme = "README.md"
documentation = "https://docs.rs/ydp"
keywords = ["cdp", "chromium", "chrome", "devtools", "browser"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[lints]
workspace = true

[dependencies]
ydp-core = { workspace = true, default-features = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process", "fs"] }
futures-util.workspace = true
base64 = "0.23"
tempfile = "3"
