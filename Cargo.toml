[workspace]
members = ["crates/ydp-core", "crates/ydp", "crates/ydp-gen", "tests/echo"]
exclude = ["docs/verification/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.98.1"
repository = "https://github.com/yitao2/ydp"
homepage = "https://github.com/yitao2/ydp"
license = "MIT"
authors = ["xiaoyi <960441337@qq.com>"]

[workspace.dependencies]
ydp-core = { path = "crates/ydp-core", version = "=0.1.0-alpha.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "test-util"] }
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
thiserror = "2"
pin-project-lite = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
